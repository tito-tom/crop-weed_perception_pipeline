# ─────────────────────────────────────────────────────────────────────────────
# YOLO11-Seg-Root — Model Architecture Specification
# ─────────────────────────────────────────────────────────────────────────────
nc: 4

scales:
  n: [0.50, 1.00, 512]   # nano
  s: [0.50, 0.50, 1024]  # small
  m: [0.50, 1.00, 512]   # medium  ← Primary scaling
  l: [1.00, 1.00, 512]   # large
  x: [1.00, 1.50, 512]   # extra-large

backbone:
  - [-1, 1, Conv, [64, 3, 2]]          # 0: P1/2
  - [-1, 1, Conv, [128, 3, 2]]         # 1: P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]  # 2: feature processing
  - [-1, 1, Conv, [256, 3, 2]]         # 3: P3/8
  - [-1, 2, C3k2, [512, False, 0.25]]  # 4: feature processing
  - [-1, 1, Conv, [512, 3, 2]]         # 5: P4/16
  - [-1, 2, C3k2, [512, True]]         # 6: feature processing
  - [-1, 1, Conv, [1024, 3, 2]]        # 7: P5/32
  - [-1, 2, C3k2, [1024, True]]        # 8: feature processing
  - [-1, 1, SPPF, [1024, 5]]           # 9: Spatial Pyramid Pooling Fast
  - [-1, 2, C2PSA, [1024]]             # 10: Position-Sensitive Attention

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]]          # 12: cat backbone P4
  - [-1, 2, C3k2, [512, False]]        # 13

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]]          # 15: cat backbone P3
  - [-1, 2, C3k2, [256, False]]        # 16 (P3/8-small)

  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 13], 1, Concat, [1]]         # 18: cat head P4
  - [-1, 2, C3k2, [512, False]]        # 19 (P4/16-medium)

  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 10], 1, Concat, [1]]         # 21: cat head P5
  - [-1, 2, C3k2, [1024, True]]        # 22 (P5/32-large)

  - [[16, 19, 22], 1, CustomSegmentHead, [nc, 32, 256]]  # 23: Custom Dual Head
